<!doctype html>
<!-- Офлайн-рендер хромовых спрайтов Y2K-темы (запускает tools/y2k-sprites.py): та же three.js-геометрия,
     что была в живой сцене, но рендерится один раз в прозрачные WebP — в Mini App остаются картинки и CSS. -->
<meta charset="utf-8">
<script type="importmap">{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js"}}</script>
<script type="module">
import * as THREE from "three";

const renderer = new THREE.WebGLRenderer({antialias: true, alpha: true, preserveDrawingBuffer: true});
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1;
renderer.setClearColor(0, 0);
document.body.appendChild(renderer.domElement);

// чёрная студия с яркими полосами — резкие белые блики хрома
const pmrem = new THREE.PMREMGenerator(renderer), env = new THREE.Scene();
env.background = new THREE.Color(0x020207);
// «хромовый горизонт»: светлое небо, тёмная полоса у горизонта, светлый низ — так блестит хром на постерах 2000-х
{
  const g = new THREE.SphereGeometry(30, 64, 32), col = [], pos = g.attributes.position;
  const sky = new THREE.Color(1.5, 1.55, 1.7), sky2 = new THREE.Color(.75, .85, 1.3), band = new THREE.Color(.02, .03, .09), low = new THREE.Color(.55, .5, .85);
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i) / 30, c = new THREE.Color();
    if (y > .18) c.copy(sky2).lerp(sky, Math.min(1, (y - .18) / .5));
    else if (y > -.02) c.copy(band).lerp(sky2, Math.max(0, (y - .08) / .1));
    else c.copy(band).lerp(low, Math.min(1, -y / .35));
    col.push(c.r, c.g, c.b);
  }
  g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
  env.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({vertexColors: true, side: THREE.BackSide})));
}
const strip = (w, h, x, y, z, color, power) => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({color: new THREE.Color(color).multiplyScalar(power), side: THREE.DoubleSide}));
  m.position.set(x, y, z); m.lookAt(0, 0, 0); env.add(m);
};
strip(14, 1.4, 0, 7, 2, 0xffffff, 7); strip(1.2, 10, -8, 0, 4, 0xffffff, 5); strip(1, 10, 8, 1, 3, 0xdfe6ff, 5);
strip(9, .8, 0, -6, 6, 0xffffff, 4); strip(5, 4, 0, 2, 10, 0x8fb0ff, 2.4); strip(4, 1.2, 6, -3, 7, 0xc39bff, 3); strip(3, 3, -6, 4, 6, 0x7fe9ff, 2);
const envTex = pmrem.fromScene(env, .02).texture;

const chrome = () => new THREE.MeshPhysicalMaterial({color: 0xffffff, metalness: 1, roughness: .07, envMapIntensity: 1.3, clearcoat: 1, clearcoatRoughness: .05});
const iridescent = () => new THREE.MeshPhysicalMaterial({color: 0xe8eeff, metalness: 1, roughness: .13, envMapIntensity: 1.25,
  iridescence: 1, iridescenceIOR: 1.7, iridescenceThicknessRange: [180, 820]});

function shot(object, px, {rx = 0, ry = 0, pad = 1.08} = {}) {
  const scene = new THREE.Scene();
  scene.environment = envTex;
  object.rotation.x = rx; object.rotation.y = ry;
  scene.add(object);
  const box = new THREE.Box3().setFromObject(object), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  const w = size.x * pad, h = size.y * pad;
  const cam = new THREE.OrthographicCamera(-w / 2, w / 2, h / 2, -h / 2, .1, 100);
  cam.position.set(c.x, c.y, c.z + 20); cam.lookAt(c);
  const W = Math.round(px), H = Math.round(px * h / w);
  renderer.setSize(W, H, false);
  renderer.render(scene, cam);
  return {url: renderer.domElement.toDataURL("image/webp", .9), w: W, h: H, aspect: h / w};
}

// перо: корень в (0,0), кончик вверх
function feather(len, wid) {
  const s = new THREE.Shape();
  s.moveTo(-wid * .28, 0);
  s.quadraticCurveTo(-wid * 1.05, len * .55, -wid * .05, len);
  s.quadraticCurveTo(wid * .75, len * .5, wid * .28, 0);
  s.closePath();
  const g = new THREE.ExtrudeGeometry(s, {depth: .03, bevelEnabled: true, bevelThickness: .05, bevelSize: .04, bevelSegments: 4, curveSegments: 24});
  // выгибаем: выпуклый стержень посередине и изгиб по длине — по перу бежит хромовый перелив, а не плоская заливка
  const pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), t = Math.min(1, Math.abs(x) / wid);
    pos.setZ(i, pos.getZ(i) + .32 * wid * (1 - t * t) + .35 * (y / len) ** 2 - .12 * Math.sin(y / len * Math.PI) * Math.sign(x));
  }
  g.computeVertexNormals();
  return new THREE.Mesh(g, iridescent());
}
function star(R, c) {
  const s = new THREE.Shape(), tip = i => { const a = Math.PI / 2 - i * Math.PI / 2; return [Math.cos(a) * R, Math.sin(a) * R]; };
  s.moveTo(...tip(0));
  for (let i = 0; i < 4; i++) { const a = Math.PI / 2 - i * Math.PI / 2 - Math.PI / 4; s.quadraticCurveTo(Math.cos(a) * c, Math.sin(a) * c, ...tip((i + 1) % 4)); }
  return new THREE.Mesh(new THREE.ExtrudeGeometry(s, {depth: .06, bevelEnabled: true, bevelThickness: .12, bevelSize: .08, bevelSegments: 6, curveSegments: 20}), chrome());
}
const glassProfile = () => {
  const prof = [];
  for (let i = 0; i <= 40; i++) { const a = Math.PI * i / 40 * .78; prof.push(new THREE.Vector2(Math.max(.001, Math.sin(a) * 1.15), 1.05 + Math.cos(a) * 1.15)); }
  prof.push(new THREE.Vector2(.78, .05), new THREE.Vector2(.56, -.45), new THREE.Vector2(.5, -.72));
  return new THREE.LatheGeometry(prof, 96);
};
function base() {
  const p = [new THREE.Vector2(.5, -.72)];
  for (let i = 0; i < 6; i++) { const y = -.78 - i * .14; p.push(new THREE.Vector2(.55, y), new THREE.Vector2(.47, y - .07)); }
  p.push(new THREE.Vector2(.42, -1.66), new THREE.Vector2(.16, -1.86), new THREE.Vector2(.001, -1.9));
  return new THREE.Mesh(new THREE.LatheGeometry(p, 72), chrome());
}
// лампочка целиком; glass = "chrome" (выключена) | "hot" (раскалённое белое стекло) | "mask" (только силуэт стекла)
function bulb(glass) {
  const g = new THREE.Group();
  const mat = glass === "chrome" ? chrome() : glass === "hot"
    ? new THREE.MeshPhysicalMaterial({color: 0xffffff, emissive: 0xfff4e8, emissiveIntensity: .75, roughness: .2, clearcoat: 1, envMapIntensity: .6})
    : new THREE.MeshBasicMaterial({color: 0xffffff});
  g.add(new THREE.Mesh(glassProfile(), mat));
  const curve = new THREE.CatmullRomCurve3([[-.28, -.4], [-.28, .55], [-.18, .95], [-.06, .7], [.06, .95], [.18, .7], [.28, .95], [.28, .55], [.28, -.4]].map(([x, y]) => new THREE.Vector3(x, y, .9)));
  if (glass !== "mask") g.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 120, .04, 10), glass === "hot" ? new THREE.MeshBasicMaterial({color: new THREE.Color(1, .97, .9)}) : chrome()));
  const b = base();
  if (glass === "mask") b.material = new THREE.MeshBasicMaterial({color: 0x000000, transparent: true, opacity: 0});
  g.add(b);
  return g;
}

window.renderAll = () => ({
  feather1: shot(feather(3.3, .42), 72, {ry: .35}),
  feather2: shot(feather(2.0, .4), 66, {ry: .35}),
  feather3: shot(feather(1.15, .36), 60, {ry: .35}),
  star: shot(star(1, .14), 160, {rx: .25, ry: .4}),
  bulbOff: shot(bulb("chrome"), 300, {rx: .08}),
  bulbOn: shot(bulb("hot"), 300, {rx: .08}),
  bulbMask: shot(bulb("mask"), 300, {rx: .08}),
});
window.ready = true;
</script>
